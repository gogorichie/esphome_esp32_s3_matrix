# Dependabot configuration
#
# Cadence:  one batched run per month — the 28th at 20:00 America/Chicago.
# Grouping: every update an ecosystem manages lands in a single pull request,
#           so routine maintenance is one review, not a stream of them.
# Security: Dependabot security updates are NOT bound by this schedule or by
#           the cooldown below. They open as soon as an advisory lands, and
#           they ignore `open-pull-requests-limit`. Slow cadence for routine
#           bumps, fast lane for vulnerabilities.
#
# Guidance:
#   https://github.blog/security/supply-chain-security/tame-dependabot-group-your-updates-slow-the-cadence-keep-security-fast/
#   https://github.blog/security/application-security/cutting-through-the-noise-how-to-prioritize-dependabot-alerts/
#   https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

updates:
  # Workflow actions used by .github/workflows. The ESPHome YAML in this repo
  # is not a package manifest Dependabot can track.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 20 28 * *" # 28th of the month, 8:00 PM
      timezone: "America/Chicago"
    # Let a release sit for a week before adopting it, so the community has a
    # chance to surface bad publishes. Never applied to security updates.
    cooldown:
      default-days: 7
    # Grouping — not open-pull-requests-limit — is the noise control here.
    groups:
      actions-monthly:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
